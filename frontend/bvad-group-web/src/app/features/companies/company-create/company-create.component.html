<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-slate-800 rounded-2xl border border-slate-700 w-full max-w-2xl my-8 shadow-2xl">

    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-slate-700">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        ➕ Nouvelle filiale
      </h2>
      <button (click)="cancel()" class="text-slate-400 hover:text-white text-2xl leading-none">×</button>
    </div>

    <!-- Body -->
    <form (ngSubmit)="submit()" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">

      <!-- Preview -->
      <div
        class="rounded-xl border-2 p-4 flex items-center gap-4"
        [style.background]="form.color + '20'"
        [style.borderColor]="form.color"
      >
        <div
          class="w-16 h-16 rounded-xl flex items-center justify-center text-4xl"
          [style.background]="form.color + '30'"
        >
          {{ form.logo }}
        </div>
        <div>
          <div class="text-white font-bold text-lg">{{ form.name || 'Nom de la filiale' }}</div>
          <div class="text-slate-300 text-sm font-mono">{{ form.code || 'CODE' }}</div>
          <div *ngIf="form.slogan" class="text-slate-400 text-xs italic mt-1">« {{ form.slogan }} »</div>
        </div>
      </div>

      <!-- Code + Nom -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-slate-300">Code * <span class="text-slate-500">(ex: BVAD_SANTE)</span></label>
          <input
            [(ngModel)]="form.code" name="code" required
            placeholder="BVAD_XXXX"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono uppercase focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Nom commercial *</label>
          <input
            [(ngModel)]="form.name" name="name" required
            placeholder="BVAD Xxxxx"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
          />
        </div>
      </div>

      <div>
        <label class="text-sm text-slate-300">Raison sociale</label>
        <input
          [(ngModel)]="form.legalName" name="legalName"
          placeholder="BVAD XXXXX SARL"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
        />
      </div>

      <div>
        <label class="text-sm text-slate-300">Slogan</label>
        <input
          [(ngModel)]="form.slogan" name="slogan"
          placeholder="Verbe · Verbe · Verbe"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
        />
      </div>

      <div>
        <label class="text-sm text-slate-300">Description</label>
        <textarea
          [(ngModel)]="form.description" name="description" rows="2"
          placeholder="Activité principale de la filiale"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
        ></textarea>
      </div>

      <!-- Emoji picker -->
      <div>
        <label class="text-sm text-slate-300">Icône (emoji fallback)</label>
        <div class="flex flex-wrap gap-2 mt-2">
          <button
            type="button"
            *ngFor="let e of emojiChoices"
            (click)="pickEmoji(e)"
            class="w-10 h-10 rounded-lg text-2xl transition"
            [class.bg-bvad-secondary]="form.logo === e"
            [class.bg-slate-700]="form.logo !== e"
            [class.hover:bg-slate-600]="form.logo !== e"
          >
            {{ e }}
          </button>
        </div>
      </div>

      <!-- Couleur -->
      <div>
        <label class="text-sm text-slate-300">Couleur d'identité</label>
        <div class="flex flex-wrap gap-2 mt-2">
          <button
            type="button"
            *ngFor="let c of colorChoices"
            (click)="pickColor(c.value)"
            class="w-10 h-10 rounded-lg border-2 transition"
            [style.background]="c.value"
            [class.border-white]="form.color === c.value"
            [class.border-transparent]="form.color !== c.value"
            [title]="c.name"
          ></button>
          <input
            type="color"
            [(ngModel)]="form.color" name="colorPicker"
            class="w-10 h-10 rounded-lg cursor-pointer border-2 border-slate-600"
          />
        </div>
      </div>

      <!-- Contact rapide -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4 border-t border-slate-700">
        <div>
          <label class="text-sm text-slate-300">Ville</label>
          <input
            [(ngModel)]="form.city" name="city"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Pays</label>
          <input
            [(ngModel)]="form.country" name="country"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-slate-300">Téléphone</label>
          <input
            [(ngModel)]="form.phone" name="phone"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Email</label>
          <input
            type="email" [(ngModel)]="form.email" name="email"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-slate-300">Directeur</label>
          <input
            [(ngModel)]="form.directorName" name="directorName"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Titre</label>
          <input
            [(ngModel)]="form.directorTitle" name="directorTitle"
            placeholder="Directeur Général"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
      </div>

      <p class="text-xs text-slate-500">
        💡 Vous pourrez uploader logo, cachet et signature depuis la page de la filiale après création.
      </p>

      <!-- Erreur -->
      <div *ngIf="error()" class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm">
        ⚠ {{ error() }}
      </div>
    </form>

    <!-- Footer -->
    <div class="flex justify-end gap-3 p-6 border-t border-slate-700 bg-slate-900/40 rounded-b-2xl">
      <button
        type="button" (click)="cancel()"
        class="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg"
      >Annuler</button>
      <button
        type="button" (click)="submit()" [disabled]="saving()"
        class="bg-bvad-secondary hover:bg-amber-600 disabled:opacity-50 text-white font-semibold px-6 py-2 rounded-lg"
      >
        {{ saving() ? 'Création...' : '✅ Créer la filiale' }}
      </button>
    </div>
  </div>
</div>
