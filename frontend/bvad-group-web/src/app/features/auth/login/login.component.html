<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-bvad-dark via-slate-900 to-blue-950 p-4">

  <!-- Carte principale -->
  <div class="w-full max-w-md">

    <!-- Header BVAD -->
    <div class="text-center mb-8">
      <div class="text-6xl mb-3">🏢</div>
      <h1 class="text-4xl font-bold text-white">
        <span class="text-bvad-secondary">BVAD</span> GROUP
      </h1>
      <p class="text-slate-400 mt-2 text-sm">
        Bâtir. Valoriser. Accompagner. Développer.
      </p>
    </div>

    <!-- Formulaire -->
    <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-slate-700">
      <h2 class="text-xl font-semibold text-white mb-6 flex items-center gap-2">
        <span>🔐</span> Connexion
      </h2>

      <form (ngSubmit)="submit()" #f="ngForm" class="space-y-5">

        <!-- Username -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Nom d'utilisateur ou email
          </label>
          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            required
            autocomplete="username"
            placeholder="ex: divin"
            class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-bvad-secondary focus:border-transparent transition"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-2">
            Mot de passe
          </label>
          <div class="relative">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="••••••••"
              class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-bvad-secondary focus:border-transparent transition pr-12"
            />
            <button
              type="button"
              (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white transition"
            >
              {{ showPassword() ? '🙈' : '👁' }}
            </button>
          </div>
        </div>

        <!-- Erreur -->
        <div
          *ngIf="error()"
          class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-lg text-sm"
        >
          ⚠ {{ error() }}
        </div>

        <!-- Bouton -->
        <button
          type="submit"
          [disabled]="loading() || !f.valid"
          class="w-full bg-bvad-secondary hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-lg transition flex items-center justify-center gap-2"
        >
          <span *ngIf="!loading()">Se connecter</span>
          <span *ngIf="loading()">Connexion...</span>
        </button>
      </form>

      <!-- Info dev -->
      <div class="mt-6 pt-6 border-t border-slate-700 text-xs text-slate-500 text-center">
        💡 Compte test :
        <span class="text-slate-400 font-mono">divin</span> /
        <span class="text-slate-400 font-mono">Bvad2025!</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-6 text-xs text-slate-500">
      © {{ 2025 }} BVAD GROUP. Tous droits réservés.
    </div>
  </div>
</div>
