<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-lg my-8">

    <div class="flex items-center justify-between p-6 border-b border-slate-700">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        💳 Enregistrer un paiement
      </h2>
      <button (click)="cancel()" class="text-slate-400 hover:text-white text-2xl">×</button>
    </div>

    <div class="p-6 space-y-4">
      <!-- Facture ciblée -->
      <div class="bg-slate-900 border border-slate-700 rounded-lg p-3">
        <div class="text-slate-400 text-xs uppercase">Facture concernée</div>
        <div class="text-white font-bold font-mono mt-1">{{ invoice.invoiceNumber }}</div>
        <div class="text-slate-300 text-sm mt-1">{{ invoice.clientDisplayName }}</div>
        <div class="flex justify-between mt-2 pt-2 border-t border-slate-700">
          <div>
            <div class="text-slate-400 text-xs">Total TTC</div>
            <div class="text-white font-semibold">{{ money(invoice.totalTTC) }}</div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Déjà payé</div>
            <div class="text-green-400 font-semibold">{{ money(invoice.amountPaid) }}</div>
          </div>
          <div>
            <div class="text-slate-400 text-xs">Solde dû</div>
            <div class="text-orange-400 font-bold">{{ money(invoice.amountDue) }}</div>
          </div>
        </div>
      </div>

      <!-- Montant -->
      <div>
        <label class="text-sm text-slate-300 flex justify-between">
          <span>Montant *</span>
          <button
            type="button" (click)="setFullAmount()"
            class="text-bvad-secondary text-xs hover:underline"
          >
            Solde total ({{ money(invoice.amountDue) }})
          </button>
        </label>
        <input
          type="number" [(ngModel)]="form.amount" name="amount"
          min="0" step="1"
          class="w-full mt-1 px-3 py-3 bg-slate-900 border border-slate-700 rounded-lg text-white text-xl font-bold text-right focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
        />
      </div>

      <!-- Date -->
      <div>
        <label class="text-sm text-slate-300">Date de paiement *</label>
        <input
          type="date" [(ngModel)]="form.paymentDate" name="paymentDate" required
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        />
      </div>

      <!-- Méthode -->
      <div>
        <label class="text-sm text-slate-300 mb-2 block">Mode de paiement *</label>
        <div class="grid grid-cols-3 gap-2">
          <button
            type="button" (click)="form.method = 0"
            class="p-3 rounded-lg border-2 transition text-sm"
            [ngClass]="form.method === 0
              ? 'border-green-500 bg-green-500/20 text-white'
              : 'border-slate-700 bg-slate-900 text-slate-300'"
          >
            💵<br />Espèces
          </button>
          <button
            type="button" (click)="form.method = 1"
            class="p-3 rounded-lg border-2 transition text-sm"
            [ngClass]="form.method === 1
              ? 'border-blue-500 bg-blue-500/20 text-white'
              : 'border-slate-700 bg-slate-900 text-slate-300'"
          >
            🏦<br />Virement
          </button>
          <button
            type="button" (click)="form.method = 2"
            class="p-3 rounded-lg border-2 transition text-sm"
            [ngClass]="form.method === 2
              ? 'border-orange-500 bg-orange-500/20 text-white'
              : 'border-slate-700 bg-slate-900 text-slate-300'"
          >
            📱<br />Mobile Money
          </button>
          <button
            type="button" (click)="form.method = 3"
            class="p-3 rounded-lg border-2 transition text-sm"
            [ngClass]="form.method === 3
              ? 'border-purple-500 bg-purple-500/20 text-white'
              : 'border-slate-700 bg-slate-900 text-slate-300'"
          >
            📝<br />Chèque
          </button>
          <button
            type="button" (click)="form.method = 4"
            class="p-3 rounded-lg border-2 transition text-sm"
            [ngClass]="form.method === 4
              ? 'border-cyan-500 bg-cyan-500/20 text-white'
              : 'border-slate-700 bg-slate-900 text-slate-300'"
          >
            💳<br />Carte
          </button>
          <button
            type="button" (click)="form.method = 5"
            class="p-3 rounded-lg border-2 transition text-sm"
            [ngClass]="form.method === 5
              ? 'border-slate-500 bg-slate-500/20 text-white'
              : 'border-slate-700 bg-slate-900 text-slate-300'"
          >
            🔄<br />Autre
          </button>
        </div>
      </div>

      <!-- Opérateur Mobile Money -->
      <div *ngIf="isMobileMoney">
        <label class="text-sm text-slate-300">Opérateur</label>
        <select
          [(ngModel)]="form.mobileMoneyOperator" name="operator"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        >
          <option [ngValue]="1">🟡 MTN Mobile Money</option>
          <option [ngValue]="2">🔴 Airtel Money</option>
          <option [ngValue]="99">🔄 Autre</option>
        </select>
      </div>

      <!-- Référence -->
      <div>
        <label class="text-sm text-slate-300">Référence transaction</label>
        <input
          [(ngModel)]="form.reference" name="reference"
          placeholder="N° chèque, ID transaction MTN..."
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        />
      </div>

      <!-- Notes -->
      <div>
        <label class="text-sm text-slate-300">Notes</label>
        <textarea
          [(ngModel)]="form.notes" name="notes" rows="2"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        ></textarea>
      </div>

      <div *ngIf="error()" class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm">
        ⚠ {{ error() }}
      </div>
    </div>

    <div class="flex justify-end gap-3 p-6 border-t border-slate-700 bg-slate-900/40 rounded-b-2xl">
      <button (click)="cancel()" class="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg">
        Annuler
      </button>
      <button
        (click)="submit()" [disabled]="saving()"
        class="bg-green-500 hover:bg-green-600 disabled:opacity-50 text-white font-semibold px-6 py-2 rounded-lg"
      >
        {{ saving() ? 'Enregistrement...' : '💰 Enregistrer' }}
      </button>
    </div>
  </div>
</div>
