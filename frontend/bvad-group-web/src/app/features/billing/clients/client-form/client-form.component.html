<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-2xl my-8">

    <!-- Header -->
    <div class="flex items-center justify-between p-6 border-b border-slate-700">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        {{ client ? '✏️ Modifier' : '➕ Nouveau' }} client
      </h2>
      <button (click)="cancel()" class="text-slate-400 hover:text-white text-2xl">×</button>
    </div>

    <!-- Body -->
    <form (ngSubmit)="submit()" class="p-6 space-y-4 max-h-[75vh] overflow-y-auto">

      <!-- Type -->
      <div>
        <label class="text-sm text-slate-300">Type de client *</label>
        <div class="grid grid-cols-2 gap-3 mt-2">
          <button
            type="button"
            (click)="form.type = 1"
            class="p-4 rounded-lg border-2 transition"
            [class.border-blue-500]="form.type === 1"
            [class.bg-blue-500]="form.type === 1"
            [class.bg-opacity-20]="form.type === 1"
            [class.border-slate-700]="form.type !== 1"
            [class.bg-slate-900]="form.type !== 1"
          >
            <div class="text-3xl mb-1">🏢</div>
            <div class="text-white font-medium">Entreprise</div>
            <div class="text-slate-400 text-xs">Personne morale</div>
          </button>
          <button
            type="button"
            (click)="form.type = 0"
            class="p-4 rounded-lg border-2 transition"
            [class.border-purple-500]="form.type === 0"
            [class.bg-purple-500]="form.type === 0"
            [class.bg-opacity-20]="form.type === 0"
            [class.border-slate-700]="form.type !== 0"
            [class.bg-slate-900]="form.type !== 0"
          >
            <div class="text-3xl mb-1">👤</div>
            <div class="text-white font-medium">Particulier</div>
            <div class="text-slate-400 text-xs">Personne physique</div>
          </button>
        </div>
      </div>

      <!-- Nom -->
      <div>
        <label class="text-sm text-slate-300">
          {{ isCompany ? 'Raison sociale *' : 'Nom complet *' }}
        </label>
        <input
          [(ngModel)]="form.name" name="name" required
          [placeholder]="isCompany ? 'Ex: CONGO DIGITAL SOLUTIONS' : 'Ex: Jean MBEMBA'"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-bvad-secondary focus:outline-none"
        />
      </div>

      <!-- Section entreprise -->
      <div *ngIf="isCompany" class="space-y-4 border-t border-slate-700 pt-4">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="text-sm text-slate-300">Forme juridique</label>
            <select
              [(ngModel)]="form.legalForm" name="legalForm"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            >
              <option value="">--</option>
              <option value="SARL">SARL</option>
              <option value="SA">SA</option>
              <option value="SAS">SAS</option>
              <option value="SASU">SASU</option>
              <option value="EI">Entreprise individuelle</option>
              <option value="EURL">EURL</option>
              <option value="ONG">ONG</option>
              <option value="Association">Association</option>
            </select>
          </div>
          <div>
            <label class="text-sm text-slate-300">N° RCCM</label>
            <input
              [(ngModel)]="form.registrationNumber" name="registrationNumber"
              placeholder="RC/BZV/2025/..."
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono focus:outline-none"
            />
          </div>
          <div>
            <label class="text-sm text-slate-300">N° NIU</label>
            <input
              [(ngModel)]="form.taxNumber" name="taxNumber"
              placeholder="M012500..."
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white font-mono focus:outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-slate-300">Contact principal</label>
            <input
              [(ngModel)]="form.contactPerson" name="contactPerson"
              placeholder="Ex: Marie NGANGA"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
          <div>
            <label class="text-sm text-slate-300">Fonction</label>
            <input
              [(ngModel)]="form.position" name="position"
              placeholder="Ex: Directrice Achats"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
        </div>
      </div>

      <!-- Contact -->
      <div class="border-t border-slate-700 pt-4 space-y-3">
        <div class="text-sm text-slate-400 uppercase">📞 Contact</div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-slate-300">Email</label>
            <input
              type="email" [(ngModel)]="form.email" name="email"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
          <div>
            <label class="text-sm text-slate-300">Site web</label>
            <input
              [(ngModel)]="form.website" name="website"
              placeholder="www.exemple.cg"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="text-sm text-slate-300">Téléphone principal</label>
            <input
              [(ngModel)]="form.phone" name="phone"
              placeholder="+242 06 ..."
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
          <div>
            <label class="text-sm text-slate-300">Téléphone 2</label>
            <input
              [(ngModel)]="form.secondaryPhone" name="secondaryPhone"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
        </div>
      </div>

      <!-- Adresse -->
      <div class="border-t border-slate-700 pt-4 space-y-3">
        <div class="text-sm text-slate-400 uppercase">📍 Adresse</div>

        <div>
          <label class="text-sm text-slate-300">Adresse</label>
          <input
            [(ngModel)]="form.address" name="address"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="text-sm text-slate-300">Code postal</label>
            <input
              [(ngModel)]="form.postalCode" name="postalCode"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
          <div>
            <label class="text-sm text-slate-300">Ville</label>
            <input
              [(ngModel)]="form.city" name="city"
              placeholder="Brazzaville"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
          <div>
            <label class="text-sm text-slate-300">Pays</label>
            <input
              [(ngModel)]="form.country" name="country"
              class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
            />
          </div>
        </div>
      </div>

      <!-- Notes -->
      <div class="border-t border-slate-700 pt-4">
        <label class="text-sm text-slate-300">Notes internes</label>
        <textarea
          [(ngModel)]="form.notes" name="notes" rows="3"
          placeholder="Notes commerciales, conditions particulières..."
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        ></textarea>
      </div>

      <!-- Erreur -->
      <div *ngIf="error()" class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm">
        ⚠ {{ error() }}
      </div>
    </form>

    <!-- Footer -->
    <div class="flex justify-end gap-3 p-6 border-t border-slate-700 bg-slate-900/40 rounded-b-2xl">
      <button (click)="cancel()" class="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg">
        Annuler
      </button>
      <button
        (click)="submit()"
        [disabled]="saving()"
        class="bg-bvad-secondary hover:bg-amber-600 disabled:opacity-50 text-white font-semibold px-6 py-2 rounded-lg"
      >
        {{ saving() ? 'Enregistrement...' : (client ? 'Modifier' : 'Créer') }}
      </button>
    </div>
  </div>
</div>
