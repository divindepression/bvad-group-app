<div class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 overflow-y-auto">
  <div class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-2xl my-8">

    <div class="flex items-center justify-between p-6 border-b border-slate-700">
      <h2 class="text-xl font-bold text-white flex items-center gap-2">
        {{ contract ? '✏️ Modifier' : '➕ Nouveau' }} contrat
      </h2>
      <button (click)="cancel()" class="text-slate-400 hover:text-white text-2xl">×</button>
    </div>

    <form (ngSubmit)="submit()" class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">

      <!-- Employé -->
      <div>
        <label class="text-sm text-slate-300">Employé *</label>
        <select
          [(ngModel)]="form.employeeId" name="employeeId" required
          [disabled]="!!contract"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:ring-2 focus:ring-bvad-secondary focus:outline-none disabled:opacity-50"
        >
          <option value="">-- Sélectionner --</option>
          <option *ngFor="let e of employees()" [value]="e.id">
            {{ e.fullName }} — {{ e.position }}
          </option>
        </select>
      </div>

      <!-- Type + Statut -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-slate-300">Type</label>
          <select
            [(ngModel)]="form.contractType" name="contractType"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          >
            <option [ngValue]="0">CDI</option>
            <option [ngValue]="1">CDD</option>
            <option [ngValue]="2">Stage</option>
            <option [ngValue]="3">Prestation</option>
            <option [ngValue]="4">Apprentissage</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-slate-300">Statut</label>
          <select
            [(ngModel)]="form.status" name="status"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          >
            <option [ngValue]="0">Brouillon</option>
            <option [ngValue]="1">En cours</option>
            <option [ngValue]="2">Suspendu</option>
            <option [ngValue]="3">Rompu</option>
            <option [ngValue]="4">Expiré</option>
            <option [ngValue]="5">Renouvelé</option>
          </select>
        </div>
      </div>

      <!-- Poste + Département -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-slate-300">Poste *</label>
          <input
            [(ngModel)]="form.position" name="position" required
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Département</label>
          <input
            [(ngModel)]="form.department" name="department"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-bvad-secondary"
          />
        </div>
      </div>

      <!-- Dates -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="text-sm text-slate-300">Début *</label>
          <input
            type="date" [(ngModel)]="form.startDate" name="startDate" required
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Fin (si CDD)</label>
          <input
            type="date" [(ngModel)]="form.endDate" name="endDate"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Date signature</label>
          <input
            type="date" [(ngModel)]="form.signedDate" name="signedDate"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
      </div>

      <!-- Salaire + Currency + Hours -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="text-sm text-slate-300">Salaire *</label>
          <input
            type="number" [(ngModel)]="form.salary" name="salary" required
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
        <div>
          <label class="text-sm text-slate-300">Devise</label>
          <select
            [(ngModel)]="form.currency" name="currency"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          >
            <option value="FCFA">FCFA</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-slate-300">Heures / sem.</label>
          <input
            type="number" [(ngModel)]="form.weeklyHours" name="weeklyHours"
            class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
          />
        </div>
      </div>

      <!-- Trial + Clauses -->
      <div>
        <label class="text-sm text-slate-300">Période d'essai (mois)</label>
        <input
          type="number" [(ngModel)]="form.trialPeriodMonths" name="trialPeriodMonths"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        />
      </div>

      <div>
        <label class="text-sm text-slate-300">Clauses particulières</label>
        <textarea
          [(ngModel)]="form.specialClauses" name="specialClauses" rows="3"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        ></textarea>
      </div>

      <div>
        <label class="text-sm text-slate-300">Notes internes</label>
        <textarea
          [(ngModel)]="form.notes" name="notes" rows="2"
          class="w-full mt-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none"
        ></textarea>
      </div>

      <div *ngIf="error()" class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-2 rounded-lg text-sm">
        ⚠ {{ error() }}
      </div>
    </form>

    <div class="flex justify-end gap-3 p-6 border-t border-slate-700 bg-slate-900/40 rounded-b-2xl">
      <button type="button" (click)="cancel()" class="px-4 py-2 text-slate-300 hover:bg-slate-700 rounded-lg transition">
        Annuler
      </button>
      <button
        type="button" (click)="submit()" [disabled]="saving()"
        class="bg-bvad-secondary hover:bg-amber-600 disabled:opacity-50 text-white font-semibold px-6 py-2 rounded-lg transition"
      >
        {{ saving() ? 'Enregistrement...' : (contract ? 'Modifier' : 'Créer') }}
      </button>
    </div>
  </div>
</div>
