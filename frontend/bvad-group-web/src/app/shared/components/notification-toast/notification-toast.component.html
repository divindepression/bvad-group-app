<div
  *ngIf="notif.currentToast() as t"
  class="fixed bottom-6 right-6 z-[100] max-w-sm toast-anim"
>
  <button
    (click)="onClick()"
    class="w-full bg-slate-800 border rounded-xl shadow-2xl p-4 text-left hover:scale-[1.02] transition"
    [style.borderColor]="t.color"
    [style.boxShadow]="'0 10px 40px ' + t.color + '30'"
  >
    <div class="flex gap-3">
      <div
        class="w-12 h-12 rounded-full flex items-center justify-center text-2xl flex-shrink-0"
        [style.background]="t.color + '20'"
        [style.border]="'1px solid ' + t.color"
      >
        {{ t.icon }}
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-start justify-between gap-2">
          <div class="text-white font-semibold text-sm leading-tight">
            {{ t.title }}
          </div>
          <button
            (click)="close($event)"
            class="text-slate-400 hover:text-white text-lg leading-none flex-shrink-0"
          >✕</button>
        </div>
        <div class="text-slate-300 text-xs mt-1 line-clamp-2">
          {{ t.message }}
        </div>
      </div>
    </div>
  </button>
</div>
